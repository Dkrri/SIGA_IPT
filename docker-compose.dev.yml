# Docker Compose para DESARROLLO LOCAL.
# Levanta solo la infraestructura: MySQL y Keycloak.
# El backend y el frontend se ejecutan desde el IDE / terminal durante el desarrollo.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#
# Keycloak queda en  http://localhost:8081  (admin consola: admin / admin)
# MySQL queda en     localhost:3306

services:
  mysql:
    image: mysql:8.0
    container_name: siga-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-siga_db}
    ports:
      - "3306:3306"
    volumes:
      - siga_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: siga-keycloak
    # start-dev = modo desarrollo. --import-realm carga keycloak/realm-export.json.
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      # Credenciales del usuario administrador de la consola de Keycloak.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  siga_mysql_data:
