server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router is a SPA: unknown paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively because Vite fingerprints them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
