# Test profile: in-memory H2 database in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:siga_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Do not seed demo data during tests.
siga.seed.enabled=false

# Dummy Keycloak URLs: tokens are mocked in integration tests.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/siga
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/siga/protocol/openid-connect/certs
siga.keycloak.base-url=http://localhost:8081
siga.keycloak.realm=siga
siga.keycloak.admin-client-id=siga-admin
siga.keycloak.admin-client-secret=siga-admin-secret
