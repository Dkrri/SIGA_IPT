spring.application.name=backend

# Application port
server.port=${PORT:8080}

# MySQL connection through environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siga_db}\
  ?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------
# Security - OAuth2 Resource Server (Keycloak)
# ------------------------------------------------------------------
# Public realm URL: identifies the expected issuer ("iss") of the token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/siga}
# JWKS endpoint URL: public keys used to validate the token signature.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/siga/protocol/openid-connect/certs}

# Frontend origins allowed for CORS (comma-separated).
siga.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Keycloak Admin API used to provision student/teacher users.
siga.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
siga.keycloak.realm=${KEYCLOAK_REALM:siga}
siga.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:siga-admin}
siga.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:siga-admin-secret}