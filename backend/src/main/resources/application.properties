spring.application.name=backend

# Puerto de la aplicación
server.port=${PORT:8080}

# Conexión a la base de datos MySQL mediante variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siga_db}\
  ?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------
# Seguridad - OAuth2 Resource Server (Keycloak)
# ------------------------------------------------------------------
# URL publica del realm: identifica al emisor ("iss") que debe traer el token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/siga}
# URL del endpoint JWKS: llaves publicas con las que se valida la firma del token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/siga/protocol/openid-connect/certs}

# Origenes del frontend permitidos para CORS (separados por coma).
siga.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}